[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domino"
version = "0.1.0"
description = "A lightweight Hydra-based serial workflow orchestration library."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
domino = "domino.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
